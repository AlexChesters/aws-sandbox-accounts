[project]
name = "lease-manager-web"
version = "0.1.0"
description = "web interface for managing AWS sandbox account leases"
authors = [{name = "Alex Chesters", email = "alex@cheste.rs"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
